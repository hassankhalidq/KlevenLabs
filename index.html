<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#111111" />

    <title>Klevon Labs: hand-coded websites, stores and apps</title>
    <!-- Kept under 160 characters so search results do not truncate it. -->
    <meta
      name="description"
      content="A one-person studio building hand-coded websites, stores and apps for clients in the Gulf, UK, Australia and Southeast Asia. No templates, no page builders."
    />
    <link rel="canonical" href="https://kleven-labs.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Klevon Labs" />
    <meta property="og:url" content="https://kleven-labs.vercel.app/" />
    <meta property="og:title" content="Klevon Labs" />
    <meta
      property="og:description"
      content="Built like a product. Designed like art. Coded by hand."
    />
    <!-- Rendered from the real hero by qa/make-og.mjs. Regenerate after any
         hero change so the share card does not drift from the page. -->
    <meta property="og:image" content="https://kleven-labs.vercel.app/og.jpg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="Klevon Labs. Built like a product. Designed like art. Coded by hand."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- One typeface for the whole page, per the brand guide. Preloaded
         because the hero headline is the LCP element. -->
    <link
      rel="preload"
      href="/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- The page is client-rendered, so without JS the root stays empty. This
         is the whole content, not a nag: it still says who this is and how to
         make contact. -->
    <noscript>
      <div style="
        min-height: 100vh; display: flex; flex-direction: column;
        justify-content: center; gap: 1.5rem; padding: 2rem 6vw;
        background: #111111; color: #efeee9;
        font-family: 'Manrope', system-ui, sans-serif;
      ">
        <p style="
          font-family: 'Manrope', system-ui, sans-serif; font-size: 0.75rem;
          letter-spacing: 0.2em; text-transform: uppercase; color: #f4c430;
        ">Karachi-built. Globally shipped.</p>
        <h1 style="
          font-family: 'Manrope', system-ui, sans-serif;
          font-size: clamp(2rem, 6vw, 4.5rem); line-height: 0.95;
          letter-spacing: -0.035em; font-weight: 800; margin: 0;
        ">Built like a product.<br />Designed like art.<br />Coded by hand.</h1>
        <p style="max-width: 46ch; line-height: 1.5; color: rgba(239,238,233,0.72);">
          Klevon Labs designs and builds websites, stores and apps for clients
          in the Gulf, UK, Australia and Southeast Asia. This page needs
          JavaScript for the full experience.
        </p>
        <p>
          <a href="mailto:hassankhalidq@gmail.com" style="
            display: inline-block; background: #f4c430; color: #111111;
            padding: 1rem 1.75rem; text-decoration: none;
            font-family: 'Manrope', system-ui, sans-serif; font-size: 0.75rem;
            letter-spacing: 0.18em; text-transform: uppercase;
          ">Start a project</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
